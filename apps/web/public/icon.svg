<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- dark background -->
  <rect width="32" height="32" rx="7" fill="#080c14"/>

  <!-- clapperboard body -->
  <rect x="5" y="14" width="22" height="13" rx="2" fill="#e8eeff"/>

  <!-- clapper bar -->
  <rect x="5" y="8" width="22" height="7" rx="1.5" fill="#6366f1"/>

  <!-- diagonal stripes on the bar -->
  <polygon points="6,8  10.5,8  6,15"    fill="#0d0f1f" opacity="0.55"/>
  <polygon points="13,8 17.5,8 13,15"    fill="#0d0f1f" opacity="0.55"/>
  <polygon points="20,8 24.5,8 20,15"    fill="#0d0f1f" opacity="0.55"/>

  <!-- hinge pin -->
  <circle cx="5" cy="11.5" r="1.3" fill="#0d0f1f" opacity="0.3"/>

  <!-- play triangle -->
  <polygon points="13,18 21,21.5 13,25" fill="#6366f1"/>
</svg>
